# Server Configuration
server.port=8080

# Application Name
spring.application.name=Crypto Fraud & VASP Intelligence

# Mock Data Settings
app.mock.enabled=true
app.mock.transactions-file=../../data/sample-transactions.json
app.mock.vasps-file=../../data/sample-vasps.json

# Blockchain API (Etherscan Public Free Tier)
app.etherscan.api-key=${ETHERSCAN_API_KEY:}
app.etherscan.base-url=https://api.etherscan.io/api

# AI Service Settings
app.ai.enabled=false
app.ai.api-key=${AI_API_KEY:}
app.ai.provider=gemini
